name: Feature request
description: Suggest a diff-focused GitHub workflow
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: hunk-gh focuses on GitHub resources that produce an unambiguous diff Hunk can review.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What review workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed command and behavior
      placeholder: hunk gh …
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: Diff semantics
      description: What exact GitHub refs or resources should form the before and after sides?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
